<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>학생 명단 입력 방법</title><style>body{font:16px/1.6 "Malgun Gothic",sans-serif;color:#202834;max-width:980px;margin:40px auto;padding:0 24px}h1{font-size:26px}img{max-width:100%;height:auto;border:1px solid #e3e7ec;border-radius:10px}p{color:#64748b}</style></head><body><main><h1>학생 명단 입력 방법</h1><p>엑셀·구글시트에서 이름을 복사한 뒤 첫 번째 이름 칸에 붙여넣으세요. 이메일도 같은 방법으로 붙여넣을 수 있어요.</p><img src="../assets/attendance-roster-paste.png" alt="TM의 실제 학생 명단 입력 화면에서 이름과 이메일 두 행을 붙여넣은 예시"><p>번호·이름·이메일 세 열을 함께 붙여넣어도 돼요. 입력한 뒤 [명단 저장]을 누르세요.</p></main></body></html>
